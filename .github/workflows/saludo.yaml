name: Saludo
on:
  push:
    branches:
      - main
      - develop
env:
  name: Grezia
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo desde main
        run: echo "¡Hola, desde main soy ${{ env.name }}"
        if: github.ref == 'refs/heads/main'
        
      - name: Saludo desde develop
        run: echo "¡Hola, desde develop soy ${{ env.name }}"
        if: github.ref == 'refs/heads/develop'
